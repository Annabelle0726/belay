services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      QUANTUM_BACKEND: ${QUANTUM_BACKEND:-local}
      STORE_BACKEND: ${STORE_BACKEND:-sql}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./qimvp.db}
      # Model layer: Jetstream2 Inference Service (no token when this container
      # runs on a JS2/IU instance; no SUs consumed). Off-instance, set
      # LLM_BASE_* to the Open WebUI proxy and LLM_API_KEY to your token.
      LLM_PROVIDER: ${LLM_PROVIDER:-jetstream}
      MODEL_FAST: ${MODEL_FAST:-llama-4-scout}
      MODEL_STRONG: ${MODEL_STRONG:-gpt-oss-120b}
      REASONING_STRONG: ${REASONING_STRONG:-high}
      LLM_BASE_FAST: ${LLM_BASE_FAST:-https://llm.jetstream-cloud.org/llama-4-scout/v1}
      LLM_BASE_STRONG: ${LLM_BASE_STRONG:-https://llm.jetstream-cloud.org/gpt-oss-120b/v1}
      LLM_API_KEY: ${LLM_API_KEY:-EMPTY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: qi
      POSTGRES_PASSWORD: qi
      POSTGRES_DB: qimvp
    volumes:
      - qi_pgdata:/var/lib/postgresql/data
    ports:
      # Host 5433 → container 5432: avoids a native Postgres already on loopback 5432.
      - "5433:5432"

volumes:
  qi_pgdata:
