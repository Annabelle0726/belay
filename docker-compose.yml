# One-command bring-up of the peer-tutor framework as a deployable agent object.
#
#   docker compose up --build          # SQLite default + openai_compatible provider
#
# Compute-agnostic by default: SQLite (zero-config durable, no DB service required)
# and the self-hosted OpenAI-compatible provider. Point OPENAI_BASE_URL at any
# local or institutional model endpoint — no lock-in, no external API required.
# With a self-hosted endpoint, student code and prompts stay on institutional
# compute (FERPA posture; see docs/quad-tutor-protocol.md and VALIDATION).
#
# Postgres is OPT-IN (it is for scale, not a prerequisite):
#   docker compose --profile postgres up --build
#   # then set DATABASE_URL=postgresql+psycopg://qi:qi@db:5432/qimvp
services:
  tutor:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      PROVIDER: ${PROVIDER:-openai_compatible}
      TUTOR_PACK: ${TUTOR_PACK:-datascience}
      STORE_BACKEND: ${STORE_BACKEND:-sql}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./qimvp.db}
      # Point this at your model endpoint (host Ollama/vLLM, or an institutional
      # OpenAI-compatible service). host.docker.internal reaches a host process.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:11434/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-ollama}
      MODEL_FAST: ${MODEL_FAST:-llama3.2}
      MODEL_STRONG: ${MODEL_STRONG:-llama3.2}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    extra_hosts:
      # Lets the container reach a model endpoint on the host (Linux parity with
      # Docker Desktop's built-in host.docker.internal).
      - "host.docker.internal:host-gateway"

  # Optional Postgres for scale (opt-in via the "postgres" profile).
  db:
    image: postgres:16
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: qi
      POSTGRES_PASSWORD: qi
      POSTGRES_DB: qimvp
    volumes:
      - qi_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

volumes:
  qi_pgdata:
