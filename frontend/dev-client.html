<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sol — backend dev client</title>
<style>
  /* ---- design tokens: every colour/spacing value lives here, never inline ---- */
  :root {
    color-scheme: dark;

    --bg: #0e1116;
    --surface: #11151c;
    --surface-2: #1a212c;
    --field-bg: #11151c;
    --code-bg: #0b0f14;

    --text: #e6e9ef;
    --muted: #8b93a7;
    --code-text: #d7f7e9;

    --border: #222a35;
    --border-strong: #2b3543;
    --accent: #3a64ff;
    --accent-soft: #e7a93e22;
    --accent-soft-border: #e7a93e66;
    --accent-soft-text: #e7a93e;
    --warn: #e7a93e;

    --accent-teal: #5fd0c5;
    --bar-track: #1a212c;
    --shadow: 0 1px 2px rgba(0, 0, 0, .45);

    --radius-card: 12px;
    --radius-control: 8px;
    --radius-pill: 999px;

    --pad-card: clamp(12px, 1.1vw + 8px, 18px);
    --pad-page: clamp(12px, 1.4vw + 8px, 22px);
    --gap: clamp(10px, .9vw + 6px, 18px);
    --pad-control: .5rem .75rem;
    --pad-pill: .15rem .55rem;
    --font-body: clamp(.82rem, .35vw + .72rem, .92rem);
    --font-code: clamp(.76rem, .3vw + .68rem, .84rem);
    --right-col: clamp(19rem, 27vw, 31rem);   /* fixed width of the telemetry column */
  }

  /* ---- light theme: same token names, different values (applied on <html data-theme>) ---- */
  :root[data-theme="light"] {
    color-scheme: light;

    --bg: #f4f6fa;
    --surface: #ffffff;
    --surface-2: #eef1f7;
    --field-bg: #ffffff;
    --code-bg: #f7f9fc;

    --text: #141a24;
    --muted: #5b6577;
    --code-text: #17324a;

    --border: #dce2ec;
    --border-strong: #c6cfdd;
    --accent: #2f4fe0;
    --accent-soft: #b26b0022;
    --accent-soft-border: #b26b0055;
    --accent-soft-text: #8a5300;
    --warn: #8a5300;

    --accent-teal: #12897c;
    --bar-track: #e6eaf2;
    --shadow: 0 1px 2px rgba(20, 26, 36, .07);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: var(--font-body)/1.5 ui-sans-serif, system-ui, -apple-system, "Hanken Grotesk", sans-serif;
  }

  /* ---- header ---- */
  .app-header {
    position: sticky;
    top: 0;
    z-index: 1;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--gap);
    padding: var(--pad-control) var(--pad-page);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .brand { font-family: Fraunces, Georgia, serif; }
  .badge {
    padding: var(--pad-pill);
    background: var(--accent-soft);
    border: 1px solid var(--accent-soft-border);
    border-radius: var(--radius-control);
    color: var(--accent-soft-text);
    font-size: .78em;
    font-weight: 600;
  }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: var(--gap); }

  /* ---- theme switch ---- */
  .segmented {
    display: flex;
    gap: .15rem;
    padding: .15rem;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
  }
  .segmented button {
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: .25rem .7rem;
    border-radius: var(--radius-pill);
    font: inherit;
    cursor: pointer;
  }
  .segmented button[aria-pressed="true"] {
    background: var(--accent);
    color: #fff;
  }

  /* ---- two-column master grid: controls/editor/results | telemetry ---- */
  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, var(--right-col));
    align-items: start;          /* both columns hug the top edge */
    gap: var(--gap);
    padding: var(--pad-page);
  }
  /* ---- left column: one vertical stack, so every box shares the same edges ---- */
  .col-left {
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    width: 100%;
    min-width: 0;
    align-self: start;
  }
  /* ---- right column: fixed track width, stacks its own cards ---- */
  .col-right {
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    width: 100%;
    min-width: 0;
    align-self: start;
  }
  .stack { display: flex; flex-direction: column; gap: var(--gap); min-width: 0; }
  /* ---- action row sits directly under the editor ---- */
  .actions { display: flex; flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: flex-start; gap: var(--gap); }

  /* ---- shared card scaffold ---- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: var(--pad-card);
    box-shadow: var(--shadow);
    min-width: 0;
  }
  .card-title {
    margin: 0 0 var(--gap);
    color: var(--muted);
    font-size: .78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .04em;
  }

  /* ---- controls ---- */
  select, button, input {
    background: var(--field-bg);
    color: var(--text);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-control);
    padding: var(--pad-control);
    font: inherit;
  }
  input { width: 100%; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .btn-primary { border-color: var(--accent); }
  .field { flex: 1 1 12rem; min-width: 0; }

  textarea {
    display: block;
    width: 100%;
    height: 200px;
    background: var(--code-bg);
    color: var(--code-text);
    border: 1px solid var(--border);
    border-radius: var(--radius-control);
    padding: var(--pad-control);
    font: var(--font-code)/1.5 "JetBrains Mono", ui-monospace, monospace;
    resize: vertical;
  }

  /* ---- glass box bits ---- */
  .bar { flex: 1 1 auto; height: 8px; min-width: 3rem; background: var(--bar-track); border-radius: var(--radius-pill); overflow: hidden; }
  .bar > span { display: block; width: 0; height: 100%; background: var(--accent-teal); transition: width .25s ease; }
  .pill {
    padding: var(--pad-pill);
    border-radius: var(--radius-pill);
    background: var(--surface-2);
    border: 1px solid var(--border-strong);
    font-size: .8em;
  }
  .label {
    flex: 0 0 6.5rem;
    color: var(--muted);
    font-size: .78em;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--gap); margin: 0; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<header class="app-header">
  <span><b class="brand">Sol</b> — backend dev client</span>
  <span class="muted">·&nbsp;proves the live loop (run → grade → Sol)</span>
  <span class="badge">
    DEV ONLY — not for pilot: uses hardcoded PID, skips consent registration, omits stance
  </span>
  <div class="header-right">
    <div class="segmented" role="group" aria-label="Colour theme">
      <button type="button" data-theme-set="auto">Auto</button>
      <button type="button" data-theme-set="light">Light</button>
      <button type="button" data-theme-set="dark">Dark</button>
    </div>
    <span id="status" class="muted"></span>
  </div>
</header>
<main>
  <!-- left: user controls, editor, action buttons and run result -->
  <section class="col-left">
    <div class="card stack">
      <div class="card-title">Controls</div>
      <div class="row">
        <label class="label" for="backend">Backend</label>
        <input id="backend" value="http://localhost:8000" class="field" />
      </div>
      <div class="row">
        <label class="label" for="exercise">Exercise</label>
        <select id="exercise" class="field"></select>
        <label class="label" for="mode">Mode</label>
        <select id="mode"><option value="study">study</option><option value="teach">teach</option></select>
      </div>
      <p id="prompt" class="muted"></p>
    </div>

    <div class="card stack">
      <label class="card-title" for="source">Code editor</label>
      <textarea id="source"></textarea>
      <div class="actions">
        <button id="run" class="btn-primary">Synthesize &amp; Run</button>
        <button id="ask">Ask Sol</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">RUN RESULT</div>
      <pre id="result" class="muted">—</pre>
    </div>
  </section>

  <!-- right: Sol's turn and the glass-box telemetry -->
  <section class="col-right">
    <div class="card">
      <div class="card-title">Sol</div>
      <pre id="solmsg">—</pre>
      <p id="solq" class="muted"></p>
    </div>
    <div class="card">
      <div class="card-title">Glass box · the five components</div>
      <div class="row"><span class="pill" id="affect">affect</span><span class="pill" id="interv">intervention</span></div>
      <div class="row"><span class="label">confidence</span><div class="bar"><span id="confbar"></span></div><span id="conf" class="muted"></span></div>
      <div class="row"><span class="label">planner</span><span id="planner" class="muted"></span></div>
      <div class="row"><span class="label">self-eval</span><span id="selfeval" class="muted"></span></div>
      <div class="row"><span class="label">governance</span><span id="gov" class="muted"></span></div>
      <div class="row"><span class="label">memory</span><span id="mem" class="muted"></span></div>
      <div class="row"><span class="label">timings</span><span id="timings" class="muted"></span></div>
    </div>
  </section>
</main>

<script>
  // Theme: stored preference wins, otherwise follow the OS. Set before first paint
  // so a light-mode reload never flashes dark.
  (function () {
    var stored = null;
    try { stored = localStorage.getItem("sol-theme"); } catch (e) { /* private mode */ }
    var pref = stored || "auto";
    document.documentElement.dataset.themePref = pref;
    if (pref !== "auto") document.documentElement.dataset.theme = pref;
    window.solTheme = {
      set: function (next) {
        document.documentElement.dataset.themePref = next;
        if (next === "auto") delete document.documentElement.dataset.theme;
        else document.documentElement.dataset.theme = next;
        try { localStorage.setItem("sol-theme", next); } catch (e) { /* ignore */ }
        window.solTheme.sync();
      },
      sync: function () {
        var cur = document.documentElement.dataset.themePref || "auto";
        document.querySelectorAll("[data-theme-set]").forEach(function (b) {
          b.setAttribute("aria-pressed", String(b.dataset.themeSet === cur));
        });
      },
    };
    document.addEventListener("DOMContentLoaded", function () {
      window.solTheme.sync();
      document.querySelectorAll("[data-theme-set]").forEach(function (b) {
        b.addEventListener("click", function () { window.solTheme.set(b.dataset.themeSet); });
      });
    });
  })();
</script>

<script type="module">
const $ = (id) => document.getElementById(id);
const PID = "p_dev";  // for a real session, POST /api/participant first
let EXERCISES = {};

function base() { return $("backend").value.replace(/\/$/, ""); }
async function jpost(path, body) {
  const r = await fetch(base() + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(path + " -> " + r.status);
  return r.json();
}

async function loadCurriculum() {
  const r = await fetch(base() + "/api/curriculum");
  const data = await r.json();
  const sel = $("exercise"); sel.innerHTML = "";
  data.modules.forEach((m) => m.exercises.forEach((ex) => {
    EXERCISES[ex.id] = ex;
    const o = document.createElement("option"); o.value = ex.id; o.textContent = ex.title; sel.appendChild(o);
  }));
  pick();
}
function pick() {
  const ex = EXERCISES[$("exercise").value]; if (!ex) return;
  $("prompt").textContent = ex.prompt;
  $("source").value = ex.starter;
}

let lastResult = null;
async function run() {
  $("status").textContent = "running…";
  try {
    lastResult = await jpost("/api/run", { participant_id: PID, exercise_id: $("exercise").value, source: $("source").value });
    $("result").textContent = lastResult.ok
      ? `backend=${lastResult.backend}  goalMet=${lastResult.goalMet}  tvd=${(+lastResult.tvd).toFixed(3)}\n` +
        lastResult.dist.map((d) => `${d.bits}: ${(d.p * 100).toFixed(0)}%`).join("   ") + `\n${lastResult.diff}`
      : "error: " + lastResult.error;
    $("status").textContent = "";
  } catch (e) { $("status").textContent = String(e); }
}

async function ask(event) {
  $("status").textContent = "Sol is thinking…";
  try {
    const out = await jpost("/api/sol/turn", {
      participant_id: PID, exercise_id: $("exercise").value,
      event: event || "chat", mode: $("mode").value, stance: "peer",
      source: $("source").value, result: lastResult, recent: [],
    });
    $("solmsg").textContent = out.message;
    $("solq").textContent = out.check_question ? "↳ " + out.check_question : "";
    $("affect").textContent = out.affective_state;
    $("interv").textContent = out.intervention;
    const c = Math.round((out.confidence || 0) * 100);
    $("confbar").style.width = c + "%"; $("conf").textContent = c + "%";
    $("planner").textContent = out.planner_note;
    const se = out.components?.self_eval || {};
    $("selfeval").textContent = `${out.self_critique}  ·  leak_risk=${se.leak_risk}`;
    $("gov").textContent = out.components?.governance?.prose || out.governance;
    $("mem").textContent = `grasped: ${(out.memory.grasped || []).join(", ") || "—"}  ·  shaky: ${(out.memory.shaky || []).join(", ") || "—"}`;
    const t = out.components?.timings_ms || {};
    $("timings").textContent = Object.entries(t).map(([k, v]) => `${k}=${v}`).join("  ");
    $("status").textContent = "";
  } catch (e) { $("status").textContent = String(e); }
}

$("exercise").addEventListener("change", pick);
$("backend").addEventListener("change", loadCurriculum);
$("run").addEventListener("click", () => run().then(() => ask("run")));
$("ask").addEventListener("click", () => ask("chat"));
loadCurriculum().catch((e) => $("status").textContent = "load failed: " + e);
</script>
</body>
</html>
