<svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" class="ai-tutor-logo">
  <defs>
    <!-- AI 蓝紫渐变 -->
    <linearGradient id="aiTutGradient" x1="2" y1="2" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="14" y1="4" x2="14" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <!-- Dark Mode 底框 -->
  <rect x="1.5" y="1.5" width="25" height="25" rx="7" fill="#1E293B" stroke="url(#aiTutGradient)" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- AI 启发星芒 (AI Sparkle) -->
  <path d="M14 4.5L15.3 8.7L19.5 10L15.3 11.3L14 15.5L12.7 11.3L8.5 10L12.7 8.7L14 4.5Z" fill="url(#sparkGrad)"/>

  <!-- 辅星芒 (金色灵感点缀) -->
  <path d="M20.5 5.5L21 7L22.5 7.5L21 8L20.5 9.5L20 8L18.5 7.5L20 7L20.5 5.5Z" fill="#F59E0B"/>

  <!-- 展开的知识书本 (Education Base) -->
  <path d="M6.5 18C8.8 16.8 11.5 16.8 13.5 18V21.5C11.5 20.3 8.8 20.3 6.5 21.5V18Z" fill="#60A5FA" fill-opacity="0.85"/>
  <path d="M21.5 18C19.2 16.8 16.5 16.8 14.5 18V21.5C16.5 20.3 19.2 20.3 21.5 21.5V18Z" fill="#818CF8" fill-opacity="0.85"/>
  <path d="M14 17.5V21.5" stroke="#94A3B8" stroke-width="1" stroke-linecap="round"/>
</svg>
